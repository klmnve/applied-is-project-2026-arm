[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "department-audit-demo"
version = "1.0.0"
description = "Department administration: local RBAC, grades, documents, sessions and audit"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "sqlmodel>=0.0.31,<0.1",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.3,<6"]
frontend = ["streamlit==1.66.1", "requests>=2.32,<3"]
dev = [
  "pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.13,<2",
  "playwright>=1.50,<2", "types-requests>=2.32,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "static/vendor/swagger/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = ".tools/pytest-cache-v2"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tools", ".venv", "models", "data", "artifacts"]
cache-dir = ".tools/ruff-v2"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
cache_dir = ".tools/mypy-v2"

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Streamlit imports NumPy stubs with Python 3.12 syntax; project code supports 3.11.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

