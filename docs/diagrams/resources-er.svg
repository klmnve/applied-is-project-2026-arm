<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650"><rect width="1400" height="650" fill="#f4f7fb" /><text font-family="Arial, sans-serif" font-size="30" x="55" y="56" fill="#183047">Кафедра АРМ — жабдықтар каталогының ER диаграммасы</text><text font-family="Arial, sans-serif" font-size="19" x="55" y="89" fill="#506478">SQLModel · SQLite · 1–4 зертханалық жұмыс</text><rect stroke-width="2" x="55" y="165" width="325" height="142" rx="10" fill="white" stroke="#b4c3d2" /><rect x="55" y="165" width="325" height="54" rx="10" fill="#183047" /><text font-family="Arial, sans-serif" font-size="23" x="73" y="200" fill="#ffffff">ResourceCategory</text><text font-family="Arial, sans-serif" font-size="19" x="73" y="250" fill="#183047">PK  id : INTEGER</text><text font-family="Arial, sans-serif" font-size="19" x="73" y="289" fill="#183047">name : TEXT UNIQUE</text><rect stroke-width="2" x="505" y="115" width="390" height="337" rx="10" fill="white" stroke="#b4c3d2" /><rect x="505" y="115" width="390" height="54" rx="10" fill="#183047" /><text font-family="Arial, sans-serif" font-size="23" x="523" y="150" fill="#ffffff">DepartmentResource</text><text font-family="Arial, sans-serif" font-size="19" x="523" y="200" fill="#183047">PK  id : INTEGER</text><text font-family="Arial, sans-serif" font-size="19" x="523" y="239" fill="#183047">name : TEXT</text><text font-family="Arial, sans-serif" font-size="19" x="523" y="278" fill="#183047">inventory_code : TEXT UNIQUE</text><text font-family="Arial, sans-serif" font-size="19" x="523" y="317" fill="#183047">FK  category_id : INTEGER</text><text font-family="Arial, sans-serif" font-size="19" x="523" y="356" fill="#183047">FK  room_id : INTEGER</text><text font-family="Arial, sans-serif" font-size="19" x="523" y="395" fill="#183047">quantity : INTEGER &gt;= 0</text><text font-family="Arial, sans-serif" font-size="19" x="523" y="434" fill="#183047">unit_cost : FLOAT &gt;= 0</text><rect stroke-width="2" x="1020" y="165" width="325" height="142" rx="10" fill="white" stroke="#b4c3d2" /><rect x="1020" y="165" width="325" height="54" rx="10" fill="#183047" /><text font-family="Arial, sans-serif" font-size="23" x="1038" y="200" fill="#ffffff">ResourceRoom</text><text font-family="Arial, sans-serif" font-size="19" x="1038" y="250" fill="#183047">PK  id : INTEGER</text><text font-family="Arial, sans-serif" font-size="19" x="1038" y="289" fill="#183047">name : TEXT UNIQUE</text><line stroke-width="3" x1="380" y1="255" x2="505" y2="255" stroke="#286fa7" /><text font-family="Arial, sans-serif" font-size="21" x="392" y="240" fill="#183047">1</text><text font-family="Arial, sans-serif" font-size="21" x="478" y="240" fill="#183047">N</text><line stroke-width="3" x1="895" y1="255" x2="1020" y2="255" stroke="#286fa7" /><text font-family="Arial, sans-serif" font-size="21" x="907" y="240" fill="#183047">N</text><text font-family="Arial, sans-serif" font-size="21" x="993" y="240" fill="#183047">1</text><text font-family="Arial, sans-serif" font-size="22" x="55" y="515" fill="#183047">Бір санатта бірнеше жабдық болады. Бір бөлмеде бірнеше жабдық орналасады.</text><text font-family="Arial, sans-serif" font-size="21" x="55" y="552" fill="#183047">Әр жабдық бір санатқа және бір бөлмеге тиесілі. PK — алғашқы кілт, FK — сыртқы кілт.</text><text font-family="Arial, sans-serif" font-size="21" x="55" y="590" fill="#183047">Жабдықтар негізгі АРМ базасында сақталады; кіру құқықтары мен аудит ортақ.</text></svg>